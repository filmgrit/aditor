name: ADITOR daily publication
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aditor-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Curate and publish with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python publish.py
      - name: Save archive
        run: |
          git config user.name 'aditor-bot'
          git config user.email 'aditor-bot@users.noreply.github.com'
          git add campaigns.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish daily ADITOR edition'
          git push
